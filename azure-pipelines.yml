trigger:
  - master

pool:
  vmImage: 'windows-2022'

variables:
  buildConfiguration: 'Release'

stages:
# =======================================================
# ETAPA DE COMPILACIÓN Y GENERACIÓN DEL APK (CI)
# =======================================================
- stage: Build
  displayName: 'Compilación Flutter Android APK'
  jobs:
  - job: BuildAndroidJob
    displayName: 'Generar APK Release'
    steps:
    # 1. Instalar Flutter SDK
    - powershell: |
        git clone https://github.com/flutter/flutter.git -b stable --depth 1 $env:AGENT_TOOLSDIRECTORY\flutter
        Write-Host "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY\flutter\bin"
      displayName: 'Instalar Flutter SDK (Stable)'

    # 2. Descargar dependencias y compilar el APK
    - powershell: |
        flutter --version
        flutter pub get
        flutter build apk --release
      displayName: 'Compilar APK en Release'

    # 3. Publicar el APK como artefacto de Azure DevOps
    - task: PublishBuildArtifacts@1
      displayName: 'Publicar APK generado como Artefacto'
      inputs:
        PathtoPublish: 'build/app/outputs/flutter-apk/app-release.apk'
        ArtifactName: 'app-apk'
        publishLocation: 'Container'